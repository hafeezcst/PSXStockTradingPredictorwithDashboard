database:
  # Data download specific configurations
  pool_size: 10
  max_overflow: 20
  pool_timeout: 30
  pool_recycle: 3600
  main_db_path: "data/databases/production/PSX_consolidated_data_PSX.db"
  alt_db_path: "data/databases/production/PSX_consolidated_data_PSX_Alternative.db"
  backup_enabled: true
  backup_interval_hours: 24

output:
  charts_folder: 'outputs/charts/RSI_AO_CHARTS'
  dashboards_folder: 'outputs/dashboards/PSX_DASHBOARDS'

telegram:
  max_images_per_message: 10
  bot_token: '6860197701:AAESTzERZLYbqyU6gFKfAwJQL8jJ_HNKLbM'
  chat_id: '-4152327824'  # Replace with your actual chat ID

analysis:
  lookback_years: 10
  rsi_thresholds: [40, 60]
  ma_periods: [10, 30, 50]
  volume_ma_period: 20
  ao_fast_period: 5
  ao_slow_period: 34

logging:
  level: 'INFO'
  format: '%(asctime)s - %(levelname)s - %(funcName)s:%(lineno)d - %(message)s'
  file: 'logs/psx_analysis.log'
  # Data download specific logging
  max_file_size_mb: 10
  backup_count: 5

# Threading configuration for data download
threading:
  max_workers: 4
  max_threads: 8
  min_threads: 2
  request_timeout: 60
  response_time_threshold_high: 1.5
  response_time_threshold_low: 0.5

# API configuration
api:
  history_url: "https://dps.psx.com.pk/historical"
  symbols_url: "https://dps.psx.com.pk/symbols"
  max_retries: 3
  pool_connections: 10
  pool_maxsize: 20
  delay_between_requests: 0.5

# Data validation settings
data_validation:
  max_price_change_percent: 50.0
  min_volume: 0
  max_volume: 1000000000
  check_ohlc_relationships: true
  validate_date_continuity: true

# Monitoring configuration
monitoring:
  enable_metrics: true
  metrics_file: "download_metrics.json"
  health_check_interval: 300

# Symbols configuration
symbols:
  file_path: "../psxsymbols.xlsx"
  sheet_name: "KSEALL"
  max_failed_attempts: 1
  max_total_failures: 500